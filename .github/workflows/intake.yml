name: Intake (Telegram + inbox)

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-db
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Intake, comps, analysis, instant alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m app.main intake
          python -m app.main rents
          python -m app.main renewal || true
          python -m app.main comps || true
          python -m app.main analyze
          python -m app.main alerts
      - name: Save database to repository
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data/scout.db
          git diff --cached --quiet || git commit -m "data: intake $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin ${{ github.ref_name }} || true
          git push
