name: Daily scan and report

on:
  schedule:
    # GitHub cron is UTC. 04:50 + 05:50 UTC covers 07:50 Israel in both summer
    # (UTC+3) and winter (UTC+2); the app sends only once, at ~08:00 local.
    - cron: "50 4 * * *"
    - cron: "50 5 * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Send the report now, regardless of the hour"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scout-db
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_report }}" = "true" ]; then
            python -m app.main daily
          else
            python -m app.main daily --scheduled
          fi
      - name: Save database to repository
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data/scout.db
          git diff --cached --quiet || git commit -m "data: daily scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin ${{ github.ref_name }} || true
          git push
